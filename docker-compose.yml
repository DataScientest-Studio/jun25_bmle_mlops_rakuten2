services:
  postgres:
    image: postgres:16
    container_name: rakuten_db
    restart: unless-stopped
    ports:
      - "5433:5432"  # Expose le port Postgres pour les clients locaux
    environment:
      POSTGRES_DB: rakuten
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
    volumes:
      - ./import:/import:ro   # Monte les CSV d'import en lecture seule dans le conteneur
      - ./sql:/sql:ro         # Monte les scripts SQL pour des exécutions répétables via init.sh
      - ./init-mlflow-db.sql:/docker-entrypoint-initdb.d/01-init-mlflow.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d rakuten"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops_network

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: rakuten_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_HOST=0.0.0.0
      - MLFLOW_SERVE_ARTIFACTS=true
      - MLFLOW_TRACKING_ALLOW_INSECURE_HTTP=true
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      - postgres
    networks:
      - mlops_network
    command:
      [
        "mlflow", "server",
        "--backend-store-uri", "postgresql://mlops:mlops@postgres:5432/mlflow",
        "--default-artifact-root", "/mlflow/artifacts",
        "--host", "0.0.0.0",
        "--port", "5000",
        "--allowed-hosts", "*"
      ]

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: rakuten_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=rakuten
      - DATABASE_USER=mlops
      - DATABASE_PASSWORD=mlops
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - mlflow_data:/mlflow
    depends_on:
      - postgres
      - mlflow
    networks:
      - mlops_network

  airflow:
    image: apache/airflow:2.8.1
    container_name: rakuten_airflow
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin123
      - AIRFLOW__CORE__FERNET_KEY=81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=
      - AIRFLOW__WEBSERVER__SECRET_KEY=rakuten_secret_key_2025
      - AIRFLOW_CONN_RAKUTEN_API=http://api:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-http==4.5.0 mlflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
    command: >
      bash -c "
        airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@rakuten.com 2>/dev/null || true &&
        airflow webserver -p 8080 & airflow scheduler
      "
    networks:
      - mlops_network

volumes:
  postgres_data:
    driver: local
  mlflow_data:
    driver: local

networks:
  mlops_network:
    driver: bridge
